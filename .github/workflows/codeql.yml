# CodeQL for vg-api.
# GitHub's stock Advanced template uses build-mode: none (or a placeholder
# manual step that exits 1). C++ here needs a real CMake build without Metal,
# Vulkan, or sanitizers. Python can stay build-mode: none.
#
# Manual run: Actions → CodeQL → Run workflow.

name: CodeQL

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install C++ build tools
        if: matrix.build-mode == 'manual'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Configure and build
        if: matrix.build-mode == 'manual'
        run: |
          cmake -S . -B build/codeql -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DVG_ENABLE_SANITIZERS=OFF \
            -DVG_ENABLE_METAL=OFF \
            -DVG_ENABLE_VULKAN=OFF
          cmake --build build/codeql --target vg_schema_generate
          cmake --build build/codeql

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
