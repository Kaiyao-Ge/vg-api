# Advanced CodeQL setup for vg-api.
# GitHub's default/autobuild setup often fails here: this is a CMake C++20
# project that must be compiled without Metal, Vulkan, or sanitizers.
#
# Run from the Actions tab → CodeQL → Run workflow.

name: CodeQL

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze C/C++
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual
          queries: security-and-quality

      - name: Configure and build
        run: |
          cmake -S . -B build/codeql -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DBUILD_TESTING=ON \
            -DVG_ENABLE_SANITIZERS=OFF \
            -DVG_ENABLE_METAL=OFF \
            -DVG_ENABLE_VULKAN=OFF
          cmake --build build/codeql --target vg_schema_generate
          cmake --build build/codeql

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
          upload: true
